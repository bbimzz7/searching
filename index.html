<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Search</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&family=DM+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080808;
    --s: #111;
    --b: #1e1e1e;
    --a: #f59e0b;
    --ad: #6b3a07;
    --t: #ccc;
    --m: #555;
    --f: 'Chakra Petch', monospace;
    --mo: 'DM Mono', monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--t);
    font-family: var(--f);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  body::before {
    content:'';
    position:fixed;
    inset:0;
    background: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.07) 2px,rgba(0,0,0,.07) 4px);
    pointer-events:none;
    z-index:99;
  }
  .wrap {
    width:100%;
    max-width:560px;
    display:flex;
    flex-direction:column;
    gap:24px;
    animation: up .5s ease forwards;
    opacity:0;
  }
  @keyframes up {
    from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:translateY(0)}
  }

  /* logo */
  .logo { text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .logo-txt { font-size:10px; letter-spacing:.45em; color:var(--a); font-weight:600; text-transform:uppercase; }

  /* search box */
  .sbox { position:relative; }
  .sbox::before,.sbox::after {
    content:''; position:absolute;
    width:10px; height:10px;
    border-color:var(--a); border-style:solid;
  }
  .sbox::before { top:-3px; left:-3px; border-width:1.5px 0 0 1.5px; }
  .sbox::after  { bottom:-3px; right:-3px; border-width:0 1.5px 1.5px 0; }

  .srow {
    display:flex;
    align-items:stretch;
    background:var(--s);
    border:1px solid var(--b);
    transition:border-color .2s;
  }
  .srow:focus-within { border-color:var(--ad); }

  .sico {
    padding:0 13px;
    display:flex;
    align-items:center;
    color:var(--m);
    flex-shrink:0;
  }

  #q {
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--t);
    font-family:var(--mo);
    font-size:14px;
    padding:15px 0;
    caret-color:var(--a);
    min-width:0;
  }
  #q::placeholder { color:var(--m); }

  .esel {
    background:transparent;
    border:none;
    border-left:1px solid var(--b);
    color:var(--a);
    font-family:var(--f);
    font-size:10px;
    padding:0 10px;
    cursor:pointer;
    outline:none;
    appearance:none;
    letter-spacing:.1em;
    flex-shrink:0;
  }
  .esel option { background:#111; color:var(--t); }

  .btn-s {
    background:var(--a);
    border:none;
    color:#000;
    font-family:var(--f);
    font-size:10px;
    font-weight:600;
    letter-spacing:.2em;
    padding:0 18px;
    cursor:pointer;
    text-transform:uppercase;
    transition:background .15s;
    flex-shrink:0;
  }
  .btn-s:hover { background:#fbbf24; }
  .btn-s:active { background:#d97706; }

  /* url row */
  .label {
    font-size:9px;
    color:var(--m);
    letter-spacing:.2em;
    font-family:var(--mo);
    text-transform:uppercase;
    margin-bottom:-16px;
  }
  .urow { display:flex; gap:8px; }
  .uinp {
    flex:1;
    background:var(--s);
    border:1px solid var(--b);
    color:var(--t);
    font-family:var(--mo);
    font-size:12px;
    padding:10px 13px;
    outline:none;
    caret-color:var(--a);
    transition:border-color .2s;
    min-width:0;
  }
  .uinp:focus { border-color:var(--ad); }
  .uinp::placeholder { color:var(--m); }

  .btn-g {
    background:transparent;
    border:1px solid var(--ad);
    color:var(--a);
    font-family:var(--f);
    font-size:10px;
    font-weight:600;
    letter-spacing:.15em;
    padding:0 16px;
    cursor:pointer;
    text-transform:uppercase;
    transition:all .15s;
    flex-shrink:0;
  }
  .btn-g:hover { background:var(--a); color:#000; }

  /* shortcuts */
  .grid {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
  }
  .sc {
    background:var(--s);
    border:1px solid var(--b);
    color:var(--m);
    font-family:var(--f);
    font-size:9px;
    letter-spacing:.1em;
    padding:10px 4px;
    cursor:pointer;
    text-transform:uppercase;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    transition:all .15s;
  }
  .sc:hover { border-color:var(--ad); color:var(--a); }
  .sc svg { opacity:.4; }
  .sc:hover svg { opacity:1; }

  /* status */
  .status {
    display:flex;
    justify-content:space-between;
    font-size:9px;
    color:var(--m);
    letter-spacing:.12em;
    font-family:var(--mo);
    border-top:1px solid var(--b);
    padding-top:12px;
  }
  .dot {
    display:inline-block;
    width:5px; height:5px;
    border-radius:50%;
    background:var(--a);
    margin-right:6px;
    animation:blink 2s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
</style>
</head>
<body>

<div class="wrap">
  <!-- Logo -->
  <div class="logo">
    <svg width="42" height="42" viewBox="0 0 42 42" fill="none">
      <rect x="2" y="2" width="38" height="38" rx="2" stroke="#f59e0b" stroke-width="1.2"/>
      <circle cx="19" cy="19" r="8" stroke="#f59e0b" stroke-width="1.2"/>
      <line x1="25" y1="25" x2="35" y2="35" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="2" y1="2" x2="8" y2="2" stroke="#f59e0b" stroke-width="2"/>
      <line x1="2" y1="2" x2="2" y2="8" stroke="#f59e0b" stroke-width="2"/>
      <line x1="40" y1="40" x2="34" y2="40" stroke="#f59e0b" stroke-width="2"/>
      <line x1="40" y1="40" x2="40" y2="34" stroke="#f59e0b" stroke-width="2"/>
    </svg>
    <div class="logo-txt">Secure Search</div>
  </div>

  <!-- Search -->
  <div class="sbox">
    <div class="srow">
      <span class="sico">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
      </span>
      <input id="q" type="text" placeholder="ketik pencarian..." autocomplete="off" spellcheck="false"/>
      <select class="esel" id="eng">
        <option value="google">Google</option>
        <option value="bing">Bing</option>
        <option value="ddg">DDG</option>
        <option value="yt">YouTube</option>
      </select>
      <button class="btn-s" onclick="doSearch()">Cari</button>
    </div>
  </div>

  <!-- URL langsung -->
  <div class="label">[ buka url langsung ]</div>
  <div class="urow">
    <input class="uinp" id="url" type="text" placeholder="https://..." autocomplete="off" spellcheck="false"/>
    <button class="btn-g" onclick="doUrl()">Buka</button>
  </div>

  <!-- Shortcuts -->
  <div class="grid">
    <button class="sc" onclick="go('https://youtube.com')">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      YouTube
    </button>
    <button class="sc" onclick="go('https://reddit.com')">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></svg>
      Reddit
    </button>
    <button class="sc" onclick="go('https://github.com')">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
      GitHub
    </button>
    <button class="sc" onclick="go('https://twitter.com')">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"/></svg>
      Twitter
    </button>
  </div>

  <!-- Status -->
  <div class="status">
    <span><span class="dot"></span>HISTORY MASKED</span>
    <span id="clk">REFERRER: BLOCKED</span>
  </div>
</div>

<script>
  const E = {
    google: q => `https://www.google.com/search?q=${encodeURIComponent(q)}`,
    bing:   q => `https://www.bing.com/search?q=${encodeURIComponent(q)}`,
    ddg:    q => `https://duckduckgo.com/?q=${encodeURIComponent(q)}`,
    yt:     q => `https://www.youtube.com/results?search_query=${encodeURIComponent(q)}`,
  };

  // XOR enkripsi + base64url
  const K = 'ssrch_vrtct';
  const enc = s => btoa(Array.from(s).map((c,i)=>String.fromCharCode(c.charCodeAt(0)^K.charCodeAt(i%K.length))).join('')).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
  const dec = s => { const p=s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((s.length+3)%4); return Array.from(atob(p)).map((c,i)=>String.fromCharCode(c.charCodeAt(0)^K.charCodeAt(i%K.length))).join(''); };

  // Cek ?r= → redirect
  (function(){
    const r = new URLSearchParams(location.search).get('r');
    if(!r) return;
    try {
      const url = dec(r);
      history.replaceState(null,'',location.pathname); // hapus ?r= dari history
      location.replace(url);
    } catch(e){}
  })();

  function go(url) {
    // Yang masuk Chrome history: domain vercel kamu + ?r=xxxx
    location.href = '?r=' + enc(url);
  }

  function doSearch() {
    const q = document.getElementById('q').value.trim();
    if(!q) return;
    go(E[document.getElementById('eng').value](q));
  }

  function doUrl() {
    let u = document.getElementById('url').value.trim();
    if(!u) return;
    if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
    go(u);
  }

  document.getElementById('q').addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });
  document.getElementById('url').addEventListener('keydown', e => { if(e.key==='Enter') doUrl(); });

  setInterval(()=>{
    document.getElementById('clk').textContent = 'REFERRER: BLOCKED · ' + new Date().toTimeString().slice(0,8);
  }, 1000);
</script>
</body>
</html>
